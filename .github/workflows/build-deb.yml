name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile display.py BRS_SSD1306/SSD1306.py
      - name: Build package
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build package (untagged)
        run: packaging/build-deb.sh
        if: "!startsWith(github.ref, 'refs/tags/v')"
      - name: Lint package
        run: dpkg-deb -I IA-digihat-display-service.deb && dpkg-deb -c IA-digihat-display-service.deb
      - uses: actions/upload-artifact@v4
        with:
          name: IA-digihat-display-service
          path: IA-digihat-display-service.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" IA-digihat-display-service.deb --title "$GITHUB_REF_NAME" --notes "Digital Hat display service ${GITHUB_REF_NAME#v}" || gh release upload "$GITHUB_REF_NAME" IA-digihat-display-service.deb --clobber
